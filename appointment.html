<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointment · Dr. Subhash Pentapati</title>
  <!-- Font Awesome for icons (optional but adds polish) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ----- global reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: #f5f0eb; /* soft background to let the “fold” pop */
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* main container – mimics the warm folded-paper / cream tone from the image */
    .new-index-appointment {
      max-width: 1200px;
      width: 100%;
      background: #fcf8f2;        /* base warm fold color */
      background-image: 
        linear-gradient(145deg, #f8f1e7 0%, #fcf8f2 100%);
      border-radius: 36px 36px 36px 36px;
      box-shadow: 
        0 20px 40px -12px rgba(0, 0, 0, 0.25),
        inset 0 1px 2px rgba(255, 245, 230, 0.8);
      padding: 2rem 2rem 2.5rem;
      transition: all 0.2s ease;
      border: 1px solid #ede6db;
      position: relative;
    }

    /* subtle fold texture: top-left “crease” effect */
    .new-index-appointment::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 0% 0%, rgba(235, 220, 200, 0.2) 0%, transparent 60%),
        repeating-linear-gradient(45deg, rgba(220, 200, 180, 0.02) 0px, rgba(220, 200, 180, 0.02) 2px, transparent 2px, transparent 6px);
      pointer-events: none;
      border-radius: 36px;
    }

    /* section header (mini) */
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
      position: relative;
      z-index: 2;
    }
    .section-title h2 {
      font-size: 1.9rem;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: #3e2e24;
      background: rgba(250, 240, 230, 0.6);
      padding-right: 20px;
      border-right: 3px solid #dac9b8;
    }
    .section-title span {
      color: #7f6a58;
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: 0.3px;
      background: rgba(235, 220, 205, 0.3);
      padding: 6px 16px;
      border-radius: 40px;
      backdrop-filter: blur(2px);
    }

    /* ----- two-column layout (form + map) ----- */
    .appointment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.2rem;
      position: relative;
      z-index: 2;
      align-items: stretch;
    }

    /* ----- left side: form ----- */
    .appointment-form {
      background: rgba(255, 250, 242, 0.6);
      backdrop-filter: blur(2px);
      padding: 1.8rem 2rem;
      border-radius: 28px;
      box-shadow: 
        inset 0 2px 8px rgba(255, 235, 210, 0.6),
        0 12px 24px -16px rgba(90, 60, 40, 0.2);
      border: 1px solid #efe4d6;
      transition: 0.2s;
    }
    .appointment-form:hover {
      background: rgba(255, 250, 242, 0.8);
      border-color: #e2d2bf;
    }

    .appointment-form h3 {
      font-size: 1.7rem;
      font-weight: 400;
      color: #3e2e24;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .appointment-form h3 i {
      color: #b4947c;
      font-size: 1.5rem;
    }
    .appointment-form .subhead {
      color: #7f6a58;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      border-left: 3px solid #dac0ab;
      padding-left: 14px;
      font-weight: 300;
    }

    .form-group {
      margin-bottom: 1.3rem;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: #4d3a2b;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: #fffcf7;
      border: 1px solid #e6d8ca;
      border-radius: 40px;
      font-size: 1rem;
      color: #2f241b;
      transition: 0.2s;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(190, 160, 135, 0.05);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #b4947c;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(180, 148, 124, 0.15);
    }
    .form-group textarea {
      border-radius: 24px;
      resize: vertical;
      min-height: 90px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn-submit {
      background: #dac0ab;
      border: none;
      padding: 14px 28px;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #2f241b;
      width: 100%;
      margin-top: 0.6rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 14px rgba(160, 130, 105, 0.2);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid #e6d2bf;
    }
    .btn-submit i {
      font-size: 1.2rem;
    }
    .btn-submit:hover {
      background: #cdb39b;
      transform: scale(1.01);
      box-shadow: 0 10px 20px rgba(140, 110, 85, 0.25);
      border-color: #b99a82;
    }
    .btn-submit:active {
      transform: scale(0.97);
    }

    /* ----- right side: map ----- */
    .appointment-map {
      background: #f2ece3;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 
        inset 0 0 0 1px rgba(235, 220, 205, 0.6),
        0 12px 24px -16px rgba(70, 50, 35, 0.2);
      border: 1px solid #e2d2bf;
      transition: 0.2s;
      min-height: 320px;
      display: flex;
      flex-direction: column;
    }
    .appointment-map:hover {
      border-color: #d0bbaa;
    }
    .map-wrapper {
      flex: 1;
      width: 100%;
      min-height: 280px;
      background: #e8ddd1;
    }
    .map-wrapper iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 280px;
      border: 0;
      filter: contrast(0.95) saturate(1.1);
    }

    /* small map caption / address */
    .map-address {
      background: rgba(245, 235, 224, 0.7);
      backdrop-filter: blur(2px);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      color: #3e2e24;
      border-top: 1px solid #ddd0c0;
    }
    .map-address i {
      color: #b4947c;
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }
    .map-address span {
      font-weight: 300;
    }
    .map-address strong {
      font-weight: 500;
      color: #2f241b;
    }

    /* ----- responsiveness ----- */
    @media screen and (max-width: 820px) {
      .appointment-grid {
        grid-template-columns: 1fr;
        gap: 1.8rem;
      }
      .new-index-appointment {
        padding: 1.5rem;
      }
      .section-title h2 {
        font-size: 1.5rem;
        border-right: none;
        padding-right: 0;
      }
      .section-title span {
        font-size: 0.85rem;
      }
      .appointment-form {
        padding: 1.5rem;
      }
      .form-row {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
      .map-wrapper iframe {
        min-height: 220px;
      }
      .appointment-map {
        min-height: 280px;
      }
    }

    @media screen and (max-width: 480px) {
      .new-index-appointment {
        padding: 1rem;
        border-radius: 28px;
      }
      .appointment-form h3 {
        font-size: 1.3rem;
      }
      .btn-submit {
        font-size: 1rem;
        padding: 12px 18px;
      }
    }

    /* additional tiny details: match the "fold" aesthetic */
    .appointment-form input::placeholder,
    .appointment-form textarea::placeholder {
      color: #bcab9a;
      font-weight: 300;
      font-size: 0.9rem;
    }
    .appointment-form select {
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23806b59" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');
      background-repeat: no-repeat;
      background-position: right 18px center;
      background-size: 16px;
    }
  </style>
</head>
<body>
  <!-- ====== NEW APPOINTMENT SECTION ====== -->
  <!-- class name exactly as requested: new-index-appointment -->
  <section class="new-index-appointment">

    <!-- header / title (optional but ties with "Meet Dr. Subhash") -->
    <div class="section-title">
      <h2><i class="fas fa-calendar-check" style="margin-right: 10px; color: #b4947c;"></i> Appointment</h2>
      <span>cosmetic · reconstructive</span>
    </div>

    <!-- two-column grid: form + map -->
    <div class="appointment-grid">

      <!-- LEFT: Appointment Form -->
      <div class="appointment-form">
        <h3>
          <i class="fas fa-pen-fancy"></i> Request a visit
        </h3>
        <div class="subhead">
          <i class="fas fa-phone-alt" style="margin-right: 8px;"></i> +91 · 90000 00000 &nbsp;|&nbsp; Kakinada
        </div>

        <form action="#" method="POST">
          <div class="form-row">
            <div class="form-group">
              <label for="fullName"><i class="far fa-user" style="margin-right: 6px;"></i> Full name</label>
              <input type="text" id="fullName" placeholder="e.g. Surya Kumar" />
            </div>
            <div class="form-group">
              <label for="phone"><i class="fas fa-phone-alt"></i> Phone</label>
              <input type="tel" id="phone" placeholder="+91 98765 43210" />
            </div>
          </div>

          <div class="form-group">
            <label for="email"><i class="far fa-envelope"></i> Email address</label>
            <input type="email" id="email" placeholder="you@example.com" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="service"><i class="fas fa-hand-holding-heart"></i> Service</label>
              <select id="service">
                <option value="">— select —</option>
                <option value="cosmetic">Cosmetic surgery</option>
                <option value="reconstructive">Reconstructive</option>
                <option value="microsurgery">Microsurgery</option>
                <option value="oncoplastic">Oncoplastic</option>
                <option value="gynecology">Cosmetic Gynecology</option>
              </select>
            </div>
            <div class="form-group">
              <label for="prefDate"><i class="far fa-calendar-alt"></i> Preferred date</label>
              <input type="date" id="prefDate" />
            </div>
          </div>

          <div class="form-group">
            <label for="notes"><i class="far fa-comment-dots"></i> Notes (optional)</label>
            <textarea id="notes" placeholder="Any specific concern or question..."></textarea>
          </div>

          <button type="submit" class="btn-submit">
            <i class="fas fa-calendar-plus"></i> Book appointment
          </button>
        </form>
      </div>

      <!-- RIGHT: Map -->
      <div class="appointment-map">
        <div class="map-wrapper">
          <!-- Google Maps embed – Kakinada (general) with marker style -->
          <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d30091.70607777618!2d82.22943546162513!3d16.97643926416288!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a382a4d0d3d5d9f%3A0x6f6b6b6b6b6b6b6b!2sKakinada%2C%20Andhra%20Pradesh!5e0!3m2!1sen!2sin!4v1712345678901!5m2!1sen!2sin" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade"
            title="Dr. Subhash Pentapati – Kakinada"
          ></iframe>
        </div>
        <div class="map-address">
          <i class="fas fa-map-pin"></i>
          <span><strong>Dr. Subhash Pentapati</strong> · Kakinada, Andhra Pradesh</span>
          <span style="margin-left: auto; font-size: 0.8rem; opacity: 0.7;">
            <i class="fas fa-location-dot"></i> 
          </span>
        </div>
        <!-- small extra: show "cosmetic gynecology" hint as in image -->
        <div style="padding: 4px 18px 12px 18px; background: rgba(245, 235, 224, 0.3); font-size: 0.8rem; color: #7f6a58; display: flex; gap: 6px; align-items: center; border-top: 1px solid #e6d8ca;">
          <i class="fas fa-female" style="color: #b4947c;"></i> 
          <span style="font-weight: 300;">Cosmetic Gynecology &amp; reconstructive care available</span>
        </div>
      </div>
      <!-- end map -->

    </div> <!-- /.appointment-grid -->
  </section>
  <!-- ====== END .new-index-appointment ====== -->
</body>
</html>
